<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LGame 工作室内部社区：游戏新闻、游戏心得、学习园地与工作日报">
  <title>LGame 工作室</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="logo">LGame<span>工作室</span></a>
      <div class="nav-links">
        <a href="/news.html">📰 新闻</a>
        <a href="/insight.html">🎮 心得</a>
        <a href="/learn.html">📚 学习</a>
        <a href="/daily.html">📝 日报</a>
        <div id="nav-auth" class="nav-auth"></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1 class="hero-title">LGame <span>工作室</span></h1>
      <p class="hero-sub">独立游戏工作室的小站 -- 分享新闻、交流心得、记录学习与每一天</p>
      <div class="btn-row">
        <a class="btn btn-primary" href="/news.html">看看最新消息</a>
        <a class="btn btn-outline" href="/daily.html">今日日报</a>
      </div>
    </section>

    <section class="features">
      <a class="feature-card" href="/news.html">
        <div class="feature-icon">📰</div>
        <h2>游戏新闻</h2>
        <p>分享值得一读的行业动态与新游资讯</p>
      </a>
      <a class="feature-card" href="/insight.html">
        <div class="feature-icon">🎮</div>
        <h2>游戏心得</h2>
        <p>记录玩过的好游戏、踩过的坑与感悟</p>
      </a>
      <a class="feature-card" href="/learn.html">
        <div class="feature-icon">📚</div>
        <h2>学习园地</h2>
        <p>学习笔记、教程与知识沉淀</p>
      </a>
      <a class="feature-card" href="/daily.html">
        <div class="feature-icon">📝</div>
        <h2>工作日报</h2>
        <p>今日完成、明日计划与遇到的问题</p>
      </a>
    </section>

    <section>
      <h2 class="section-title">🔥 最新动态</h2>
      <div id="latest-list" class="post-list"></div>
    </section>
  </main>

  <footer class="site-footer">LGame 工作室 · lgame.men · 用热爱做游戏</footer>

  <script src="/js/common.js"></script>
  <script>
    (async function () {
      await loadCurrentUser();
      const list = document.getElementById('latest-list');
      enableCardNav(list);
      list.innerHTML = '<div class="loading">加载中…</div>';
      try {
        const data = await API.get('/posts?pageSize=8');
        list.innerHTML = data.posts.length
          ? data.posts.map(postCardHtml).join('')
          : '<div class="empty">还没有内容，登录后发布第一条吧 ✨</div>';
      } catch (e) {
        list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
      }
    })();
  </script>
</body>
</html>
