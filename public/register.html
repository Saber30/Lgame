<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · LGame 工作室</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="logo">LGame<span>工作室</span></a>
      <div class="nav-links">
        <a href="/news.html">📰 新闻</a>
        <a href="/insight.html">🎮 心得</a>
        <a href="/learn.html">📚 学习</a>
        <a href="/daily.html">📝 日报</a>
        <div id="nav-auth" class="nav-auth"></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>✨ 加入工作室</h1>
        <form id="register-form">
          <label for="f-username">用户名（2-20 个字符）</label>
          <input id="f-username" required minlength="2" maxlength="20" autocomplete="username" placeholder="中文名、昵称或英文 ID">
          <label for="f-email">邮箱</label>
          <input id="f-email" type="email" required autocomplete="email" placeholder="you@example.com">
          <label for="f-password">密码（至少 6 位）</label>
          <input id="f-password" type="password" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="设置一个密码">
          <label for="f-password2">确认密码</label>
          <input id="f-password2" type="password" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="再输入一次密码">
          <button class="btn btn-primary btn-block" type="submit">注 册</button>
        </form>
        <p class="auth-switch">已经有账号了？<a href="/login.html">去登录</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">LGame 工作室 · lgame.men</footer>

  <script src="/js/common.js"></script>
  <script>
    (async function () {
      await loadCurrentUser();

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const password = document.getElementById('f-password').value;
        if (password !== document.getElementById('f-password2').value) {
          toast('两次输入的密码不一致', false);
          return;
        }
        btn.disabled = true;
        btn.textContent = '注册中…';
        try {
          const data = await API.post('/register', {
            username: document.getElementById('f-username').value.trim(),
            email: document.getElementById('f-email').value.trim(),
            password,
          });
          toast(data.message);
          setTimeout(() => (location.href = '/'), 900);
        } catch (err) {
          toast(err.message, false);
          btn.disabled = false;
          btn.textContent = '注 册';
        }
      });
    })();
  </script>
</body>
</html>
