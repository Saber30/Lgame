<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作日报 · LGame 工作室</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎮</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="logo">LGame<span>工作室</span></a>
      <div class="nav-links">
        <a href="/news.html">📰 新闻</a>
        <a href="/insight.html">🎮 心得</a>
        <a href="/learn.html">📚 学习</a>
        <a href="/daily.html">📝 日报</a>
        <div id="nav-auth" class="nav-auth"></div>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>📝 工作日报</h1>
      <p>今天做了什么、明天做什么、卡在了哪里</p>
    </div>

    <section id="compose" class="compose-card" hidden>
      <h2>📅 提交今日日报</h2>
      <form id="compose-form">
        <input id="f-title" maxlength="100" placeholder="标题（可留空，自动按日期生成）">
        <label for="f-done">✅ 今天完成了什么</label>
        <textarea id="f-done" rows="4" maxlength="10000" placeholder="今天做的工作、完成的任务、推进到哪一步了…"></textarea>
        <label for="f-plan">📋 明天计划做什么</label>
        <textarea id="f-plan" rows="3" maxlength="10000" placeholder="明天的计划与安排…"></textarea>
        <label for="f-issues">⚠️ 遇到的问题（可选）</label>
        <textarea id="f-issues" rows="3" maxlength="10000" placeholder="遇到的困难、需要谁协助、卡住的点…"></textarea>
        <button class="btn btn-primary" type="submit">提交日报</button>
      </form>
    </section>

    <div id="login-tip" class="login-tip" hidden>👉 <a href="/login.html">登录</a> 后即可提交日报</div>

    <div id="post-list" class="post-list"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <footer class="site-footer">LGame 工作室 · lgame.men</footer>

  <script src="/js/common.js"></script>
  <script>
    (async function () {
      await loadCurrentUser();
      const compose = document.getElementById('compose');
      const loginTip = document.getElementById('login-tip');
      if (currentUser) compose.hidden = false;
      else loginTip.hidden = false;

      const list = document.getElementById('post-list');
      enableCardNav(list);
      let page = 1;
      let total = 0;
      const PAGE_SIZE = 10;

      async function load() {
        list.innerHTML = '<div class="loading">加载中…</div>';
        try {
          const data = await API.get(`/posts?category=daily&page=${page}&pageSize=${PAGE_SIZE}`);
          total = data.total;
          list.innerHTML = data.posts.length
            ? data.posts.map(postCardHtml).join('')
            : '<div class="empty">还没有日报，提交今天的第一份吧</div>';
          renderPagination();
        } catch (e) {
          list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
        }
      }

      function renderPagination() {
        const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const el = document.getElementById('pagination');
        if (pages <= 1) {
          el.innerHTML = '';
          return;
        }
        el.innerHTML = `
          <button ${page <= 1 ? 'disabled' : ''} data-go="${page - 1}">上一页</button>
          <span>${page} / ${pages}</span>
          <button ${page >= pages ? 'disabled' : ''} data-go="${page + 1}">下一页</button>`;
      }

      document.getElementById('pagination').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || b.disabled) return;
        page = Number(b.dataset.go);
        load();
        scrollTo(0, 0);
      });

      document.getElementById('compose-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = '提交中…';
        try {
          const data = await API.post('/posts', {
            category: 'daily',
            title: document.getElementById('f-title').value,
            done: document.getElementById('f-done').value,
            plan: document.getElementById('f-plan').value,
            issues: document.getElementById('f-issues').value,
          });
          toast('日报已提交 ✅');
          setTimeout(() => (location.href = '/post.html?id=' + data.id), 500);
        } catch (err) {
          toast(err.message, false);
          btn.disabled = false;
          btn.textContent = '提交日报';
        }
      });

      load();
    })();
  </script>
</body>
</html>
