# Cloudflare Workers 部署配置
# 前端为 Vue 单页应用（Vite 构建，产物输出到 dist/），后端为 Worker + D1

name = "lgame"
main = "worker/index.js"
compatibility_date = "2024-09-01"

# 前端构建产物目录：由 Workers 静态资源托管
[assets]
directory = "dist"

# 每次部署前自动执行前端构建（Cloudflare 会先 npm install 再运行此命令）
[build]
command = "npm run build"

# D1 数据库绑定，变量名必须是 DB（代码中通过 env.DB 访问）
[[d1_databases]]
binding = "DB"
database_name = "lgame-db"
database_id = "7f01669b-e185-4f03-827d-2f9023ec922a"
